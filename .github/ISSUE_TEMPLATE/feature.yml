name: Feature request
about: Suggest an improvement or new workshop feature
title: ""
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the feature and any design constraints.
  - type: textarea
    attributes:
      label: Scope
      description: Note whether this is focused on retrieval, chunking, embeddings, MCP tooling, or docs.
